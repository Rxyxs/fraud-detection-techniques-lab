name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        technique:
          - 01-credit-card-fraud-multilang
          - 02-realtime-ecommerce-fraud
          - 03-graph-based-aml-detection
          - 04-autoencoder-vs-supervised
    defaults:
      run:
        working-directory: ${{ matrix.technique }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest

      # The API and latency tests in 02 load the trained artifacts, which are not versioned.
      - name: Train the models the API tests load
        if: matrix.technique == '02-realtime-ecommerce-fraud'
        run: python run_pipeline.py

      - name: Run test suite
        run: pytest tests/ -q
